name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      verify_tag:
        description: Existing public version tag to verify without publishing
        type: string
        required: true
        default: v0.4.1
concurrency:
  group: release-${{ github.event_name }}-${{ inputs.verify_tag || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: The reviewed tag names this package's version
        run: test "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "$GITHUB_REF_NAME"
      - name: Wait for the matching verified public CLI dependency
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          curl --fail --location --retry 3 --max-time 120 https://raw.githubusercontent.com/wirkspace/wirk-cli/393f2620f1e5145c39192ea14d03b2a5767ed368/scripts/release_assets.py --output "$RUNNER_TEMP/release_assets.py"
          python "$RUNNER_TEMP/release_assets.py" wait-cli --tag "$GITHUB_REF_NAME" --dest "$RUNNER_TEMP/public-cli"
      - name: Test against the matching public CLI wheel
        env:
          GIT_TERMINAL_PROMPT: "0"
          PIP_DEFAULT_TIMEOUT: "30"
        run: |
          python -m pip install "$RUNNER_TEMP"/public-cli/*.whl
          python -m pip install ".[test]" build
          python -m pytest tests -q -rs
      - run: python -m build
      - name: SHA-256 sums of what is released
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    permissions:
      contents: write
    uses: wirkspace/wirk-cli/.github/workflows/publish-release.yml@393f2620f1e5145c39192ea14d03b2a5767ed368
    with:
      kind: mcp
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    uses: wirkspace/wirk-cli/.github/workflows/publish-release.yml@393f2620f1e5145c39192ea14d03b2a5767ed368
    with:
      kind: mcp
      verify_tag: ${{ inputs.verify_tag }}
  pypi:
    # Off until this project has a trusted publisher; verification never publishes.
    needs: publish
    if: ${{ github.event_name == 'push' && vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Check existing PyPI distributions before retrying publication
        id: prepare
        run: |
          curl --fail --location --retry 3 --max-time 120 https://raw.githubusercontent.com/wirkspace/wirk-cli/393f2620f1e5145c39192ea14d03b2a5767ed368/scripts/release_assets.py --output "$RUNNER_TEMP/release_assets.py"
          python "$RUNNER_TEMP/release_assets.py" pypi-prepare --kind mcp --tag "$GITHUB_REF_NAME" --dist dist --dest pypi-dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: ${{ steps.prepare.outputs.pending == 'true' }}
        with:
          packages-dir: pypi-dist
      - name: Verify published PyPI bytes
        run: python "$RUNNER_TEMP/release_assets.py" pypi-verify --kind mcp --tag "$GITHUB_REF_NAME" --dist dist
