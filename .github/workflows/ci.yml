name: Tests and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    # GitHub's free runners once the repository is public; the project's own runner while it is private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: The 17+ MCP tests, against the wirk-cli they pin
        env:
          PRIVATE: ${{ github.event.repository.private }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          if python -m pip install "wirk==0.4.0" || python -m pip install "wirk @ git+https://github.com/wirkspace/wirk-cli@main"; then
            python -m pip install --no-deps . && python -m pip install "mcp>=2.2,<3" "anyio>=4" pytest pyyaml && python -m pytest tests -q -rs
          elif [ "$PRIVATE" = "true" ]; then
            echo "::notice::the wirk package is not installable from this private repository's runner yet; the MCP tests run once it is public or on PyPI."
          else
            exit 1
          fi
