[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wirk-mcp"
version = "0.4.4"
description = "WIRK's five tools for agents over MCP: status, query, write, review and show"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["wirk==0.4.4", "mcp>=2.2,<3", "anyio>=4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pyyaml>=6"]

[project.urls]
Homepage = "https://wirk.life"

[project.scripts]
wirk-mcp = "wirk_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wirk_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
